workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Build Android APK
        script: |
          cd app || cd android || true
          chmod +x gradlew || true
          ./gradlew assembleRelease || gradle assembleRelease
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
