workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        JAVA_VERSION: "17"
    scripts:
      - name: Build Android APK
        script: |
          # Dynamically look for where your source code folder lives
          TARGET_DIR=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          if [ -n "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
          fi

          # Force generate a brand new Gradle wrapper so gradlew exists
          gradle wrapper --gradle-version 8.10

          # Clean and compile the APK file
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
